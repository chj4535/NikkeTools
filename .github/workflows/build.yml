name: Build NikkeTools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build All Projects
        run: |
          # 1. C# (.NET) 솔루션 및 프로젝트 빌드
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            Write-Host "Building C# Project: $($_.FullName)"
            dotnet build $_.FullName -c Release
          }

          # 2. C++ (.vcxproj) 프로젝트 빌드 (MetadataDumper 등)
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            Write-Host "Building C++ Project: $($_.FullName)"
            msbuild $_.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          }
        shell: powershell

      - name: Collect Output Files
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Include *.exe, *.dll, *.bat, *.py, *.proto | Where-Object { $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\ref\*" } | Copy-Item -Destination output -Force
        shell: powershell

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: NikkeTools-Compiled
          path: output/
