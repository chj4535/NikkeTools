name: Build NikkeTools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild & Visual Studio Tools
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: msbuild -t:restore

      - name: Build C# Projects (.NET)
        run: dotnet build --configuration Release

      - name: Build C++ Projects (MSBuild)
        run: msbuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        continue-on-error: true

      - name: Collect Output Files
        run: |
          mkdir output
          Get-ChildItem -Recurse -Include *.exe, *.dll, *.bat, *.py, *.proto | Where-Object { $_.FullName -notlike "*\obj\*" } | Copy-Item -Destination output -Force
        shell: powershell

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: NikkeTools-Compiled
          path: output/
